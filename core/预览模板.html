<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>背屏壁纸 · 交互预览</title>
<style>
:root{color-scheme:dark;font-family:"MiSans","Noto Sans CJK SC","Microsoft YaHei",system-ui,sans-serif;background:#07111e;color:#edf4ff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 68% 0,#1e3950 0,transparent 50%),#07111e;min-height:100vh}
main{max-width:1200px;margin:auto;padding:48px 36px}header{display:flex;justify-content:space-between;gap:28px;align-items:end;margin-bottom:26px}
.eyebrow{font-size:12px;letter-spacing:3px;color:#94c7dc;margin-bottom:12px}h1{font-size:30px;font-weight:500;margin:0;letter-spacing:2px}.subtitle{font-size:14px;color:#9eacbb;line-height:1.9;margin:12px 0 0}
.status{font-size:12px;color:#add5e5;white-space:nowrap;padding:8px 12px;border:1px solid #416071;border-radius:24px}
.preview{padding:20px;border:1px solid #334653;border-radius:32px;background:#050a11;box-shadow:0 24px 70px #0005}
.screen{position:relative;width:100%;overflow:hidden;background:#061633;border-radius:20px;cursor:grab;touch-action:none}.screen:active{cursor:grabbing}canvas{width:100%;height:100%;display:block}.camera{position:absolute;inset:0 auto 0 0;display:none;width:30%;background:#0a101bde;pointer-events:none;align-items:center;justify-content:space-evenly;flex-direction:column;backdrop-filter:blur(6px)}
.lens{width:42%;aspect-ratio:1;border:5px solid #1a202a;background:radial-gradient(circle at 42% 38%,#203952,#030711 35%,#0d1523 62%,#020408 66%);border-radius:100%;box-shadow:0 0 0 2px #3d4148}.camera small{color:#8f9aa6;font-size:11px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:24px 0 0}.buttons{display:flex;gap:10px;flex-wrap:wrap}button{font:inherit;border:1px solid #395265;background:#132636;color:#ddecfa;border-radius:10px;padding:10px 16px;cursor:pointer;font-size:13px}button:hover{background:#203b50}button[aria-pressed=true]{border-color:#92d7ee;background:#224151}.hint{font-size:12px;color:#8fa4b7}
.readout{font-variant-numeric:tabular-nums;letter-spacing:1px;color:#b5cedb;font-size:12px}
.details{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:32px;padding-top:25px;border-top:1px solid #293c49}.details b{display:block;font-size:14px;font-weight:500;margin-bottom:10px}.details p{font-size:12px;line-height:1.9;color:#93a6b8;margin:0}.foot{margin-top:28px;color:#71889c;font-size:11px;line-height:1.9}
@media(max-width:700px){main{padding:26px 16px}header{display:block}h1{font-size:24px}.status{display:inline-block;margin-top:16px}.preview{padding:10px;border-radius:24px}.screen{border-radius:15px}.details{grid-template-columns:1fr;gap:18px}.camera small{font-size:8px}}
</style>
<main>
 <header><div><div class="eyebrow">背 屏 / 运 镜 / 时 间</div><h1 id="title">背屏壁纸</h1><p class="subtitle">移动鼠标或拖动画面，模拟手机倾斜。点击画面重新居中。</p></div><span class="status">离线预览 · 手机效果待实机验证</span></header>
 <div class="preview"><div class="screen" id="screen"><canvas id="canvas"></canvas><div class="camera" id="camera"><div class="lens"></div><div class="lens"></div><small>摄像头避让示意</small></div></div></div>
 <div class="bar"><div class="buttons"><button id="reset">镜头居中</button><button id="auto" aria-pressed="false">自动演示</button><button id="mask" aria-pressed="false">显示避让示意</button></div><div class="readout" id="readout">正在读取原始图层…</div></div>
 <div class="details"><div><b id="clock-label">系统时钟</b><p id="clock-note">星期、日期与时间随本机时间更新。</p></div><div><b id="motion-label">分层感应镜头</b><p id="motion-note">拖动画面时，近景和远景按不同深度移动。</p></div><div><b>背屏构图</b><p>可以打开摄像头示意遮罩，检查星期、时间和猫的位置。</p></div></div>
 <p class="foot">电脑交互预览。手机导入、感应和实际开孔布局待实机检查。</p>
</main>
<script>
const scene = __SCENE_DATA__;
const config = scene.config;
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const previewScreen = document.getElementById('screen');
const readout = document.getElementById('readout');
const camera = document.getElementById('camera');
const autoButton = document.getElementById('auto');
const clock = scene.clock;
const animated = Boolean(scene.restored?.length);
canvas.width = config['预览宽度'];
canvas.height = config['预览高度'];
previewScreen.style.aspectRatio = canvas.width + '/' + canvas.height;
document.getElementById('title').textContent = scene.title + (animated ? ' · 动效背屏' : ' · 感应背屏');
document.title = scene.title + ' · 交互预览';
camera.style.width = config['避让左侧比例'] * 100 + '%';
if (animated) {
  document.getElementById('motion-label').textContent = '场景动效';
  document.getElementById('motion-note').textContent = '图层动效自动播放，拖动或移动鼠标可模拟手机倾斜。';
}
let targetX = 0, targetY = 0, dx = 0, dy = 0;
let auto = false, mask = false, loaded = false, last = 0, started = null;
const maxMotion = Math.max(...scene.layers.map(layer => layer.motion));
const marginX = canvas.width * config['感应幅度'] * maxMotion;
const marginY = canvas.height * config['感应幅度'] * maxMotion * config['纵向感应比例'];
const scale = Math.max((canvas.width + 2 * marginX) / scene.width,
                       (canvas.height + 2 * marginY) / scene.height) * config['画面缩放'];
const sceneLeft = Math.min(-marginX, Math.max(canvas.width - scene.width * scale + marginX,
                           (canvas.width - scene.width * scale) * config['横向取景']));
const sceneTop = Math.min(-marginY, Math.max(canvas.height - scene.height * scale + marginY,
                          (canvas.height - scene.height * scale) * config['纵向取景']));
const assetFiles = new Set(scene.layers.flatMap(layer => [layer.asset, ...(layer.sequence?.frames ?? [])]));
if (clock) {
  for (const file of clock.assets) assetFiles.add(file);
  document.getElementById('clock-note').textContent = '三行上下居中，预览和壁纸包使用同一组原字体字形。';
} else {
  document.getElementById('clock-note').textContent = '此包按选择仅转换画面和动效。';
}
const images = new Map();
const videos = new Map();
for (const layer of scene.layers) {
  if (!layer.video) continue;
  const video = document.createElement('video');
  video.src = layer.video; video.loop = true; video.muted = true; video.playsInline = true;
  videos.set(layer.id, video); video.play().catch(() => {});
}
function loadImage(file) {
  return new Promise((resolve, reject) => {
    const image = new Image();
    image.onload = () => { images.set(file, image); resolve(); };
    image.onerror = () => reject(new Error('无法读取 ' + file));
    image.src = file;
  });
}
Promise.all(Array.from(assetFiles, loadImage)).then(() => {
  loaded = true;
  document.documentElement.dataset.loaded = 'true';
}).catch(error => {
  readout.textContent = '素材读取失败，请打开完整的预览目录。' + error.message;
});

function reset() {
  targetX = targetY = 0;
  auto = false;
  autoButton.setAttribute('aria-pressed', 'false');
}
function clamp(value, min, max) { return Math.min(max, Math.max(min, value)); }
previewScreen.addEventListener('pointermove', event => {
  if (auto) return;
  const box = previewScreen.getBoundingClientRect();
  targetX = clamp(2 * (event.clientX - box.left) / box.width - 1, -1, 1);
  targetY = clamp(2 * (event.clientY - box.top) / box.height - 1, -1, 1);
});
previewScreen.addEventListener('pointerleave', () => { if (!auto) targetX = targetY = 0; });
previewScreen.addEventListener('click', reset);
document.getElementById('reset').onclick = reset;
autoButton.onclick = () => {
  auto = !auto;
  autoButton.setAttribute('aria-pressed', String(auto));
  if (!auto) reset();
};
document.getElementById('mask').onclick = event => {
  mask = !mask;
  event.target.setAttribute('aria-pressed', String(mask));
  camera.style.display = mask ? 'flex' : 'none';
};

function interpolate(keys, ms) {
  const last = keys[keys.length - 1];
  const t = ms % last[0];
  for (let i = 1; i < keys.length; i++) {
    const next = keys[i];
    if (t >= next[0]) continue;
    const previous = keys[i - 1];
    const amount = (t - previous[0]) / (next[0] - previous[0]);
    return previous.slice(1).map((value, j) => value + (next[j + 1] - value) * amount);
  }
  return last.slice(1);
}

function layerImage(layer, ms, tilt) {
  const seq = layer.sequence;
  if (!seq || seq.frames.length === 1) return layer.asset;
  if (seq.times) {
    const at = ms % seq.period;
    const index = seq.times.findIndex(time => time > at);
    return seq.frames[index < 0 ? seq.frames.length - 1 : Math.max(0, index - 1)];
  }
  const index = seq.mode === 'tilt'
    ? Math.round((clamp(tilt, -1, 1) + 1) * (seq.frames.length - 1) / 2)
    : Math.floor((ms % seq.period) * seq.frames.length / seq.period);
  return seq.frames[index];
}

function clockLines(date) {
  if (!clock) return [];
  const pad = value => String(value).padStart(2, '0');
  return [clock.week_names[date.getDay()], date.getFullYear() + '.' + pad(date.getMonth()+1) + '.' + pad(date.getDate()),
          pad(date.getHours()) + ':' + pad(date.getMinutes()) + (config['显示秒'] ? ':' + pad(date.getSeconds()) : '')];
}

function drawClock(date) {
  if (!clock) return;
  const left = canvas.width * config['避让左侧比例'];
  const unit = config['时钟排版'] ? Math.min(canvas.width/976,canvas.height/596) : Math.min(canvas.width/976, canvas.height/596,
                        (canvas.width-left-2*clock.margin)/(2*clock.half_width),
                        (canvas.height-2*clock.margin)/clock.height);
  const half = clock.half_width*unit + clock.margin;
  const x = clamp(canvas.width*config['文字中心位置'], left+half, canvas.width-half);
  const y = canvas.height/2;
  const values = {Y:date.getFullYear(), M:date.getMonth()+1, D:date.getDate(),
                  h:date.getHours(), m:date.getMinutes(), s:date.getSeconds()};
  const paint = (file, cx, cy, w, h) =>
    ctx.drawImage(images.get(file), cx-w*unit/2, cy-h*unit/2, w*unit, h*unit);
  for (const row of clock.rows) {
    if (row.visible === false) continue;
    let rowX = row.nx === undefined ? x : row.nx*canvas.width;
    const rowY = row.ny === undefined ? y + row.y*unit : row.ny*canvas.height;
    if (row.align === 'left') rowX += row.w*unit/2;
    if (row.align === 'right') rowX -= row.w*unit/2;
    values.h = row.hourFormat === '12' ? (date.getHours()%12 || 12) : date.getHours();
    if (row.key === 'week') {
      paint(row.weekdays[date.getDay()], rowX, rowY, row.w, row.h);
      continue;
    }
    for (const part of row.pieces) {
      const file = part.asset ?? row.digits[Math.floor(values[part.digit[0]] / (10 ** Number(part.digit[1]))) % 10];
      paint(file, rowX+part.x*unit, rowY, part.w, row.h);
    }
  }
}

// 随时段变化的图层：按当天分钟在关键点之间线性插值，与背屏上的透明度表达式一致。
function timeWeight(points, minute) {
  let i = 1;
  while (i < points.length - 1 && points[i][0] < minute) i++;
  const [x0, y0] = points[i - 1], [x1, y1] = points[i];
  return x1 === x0 ? y1 : y0 + (y1 - y0) * (minute - x0) / (x1 - x0);
}

function renderScene(ms, date, tiltX, tiltY) {
  ctx.fillStyle = scene.background || '#061633';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  const minute = date.getHours() * 60 + date.getMinutes() + date.getSeconds() / 60;
  for (const layer of scene.layers) {
    let alpha = layer.fade?.length ? interpolate(layer.fade, ms)[0] / 255 : 1;
    // 视频在权重过半时显示，图片按权重渐变。
    if (layer.time) { const weight = timeWeight(layer.time, minute); alpha *= layer.video ? (weight > .5 ? 1 : 0) : weight; }
    if (alpha <= 0) continue;
    const [px, py] = layer.travel?.length ? interpolate(layer.travel, ms) : [0, 0];
    const x = sceneLeft + (layer.x + px) * scale + tiltX * canvas.width * config['感应幅度'] * layer.motion;
    const y = sceneTop + (layer.y + py) * scale + tiltY * canvas.height * config['感应幅度'] * layer.motion * config['纵向感应比例'];
    const w = layer.w * scale, h = layer.h * scale;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(x, y);
    ctx.rotate(layer.rotation * Math.PI / 180);
    const video = videos.get(layer.id);
    ctx.drawImage(video && video.readyState >= 2 ? video : images.get(layerImage(layer, ms, tiltX)), -w / 2, -h / 2, w, h);
    ctx.restore();
  }
  drawClock(date);
}

function frame(time) {
  requestAnimationFrame(frame);
  if (!loaded) return;
  if (started === null) started = time;
  const elapsed = last ? time - last : 33;
  last = time;
  if (auto) {
    targetX = Math.sin(time / 1700);
    targetY = Math.cos(time / 2300) * .7;
  }
  const smooth = 1 - Math.pow(1 - config['平滑系数'], elapsed / (1000 / config['帧率']));
  dx += (targetX - dx) * smooth;
  dy += (targetY - dy) * smooth;
  renderScene(time - started, new Date(), dx, dy);
  readout.textContent = (animated ? '动效播放中' : scene.layers.length + ' 个图层') + '  /  X ' + dx.toFixed(2) + '  Y ' + dy.toFixed(2);
}
requestAnimationFrame(frame);
</script>
</html>
